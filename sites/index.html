<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>AutoBusiness — autonomous storefronts</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { min-height: 100vh; display: grid; place-items: center; color: #fff; text-align: center; padding: 24px;
      background: radial-gradient(1200px 500px at 80% -10%, rgba(6,182,212,0.35), transparent 60%), linear-gradient(160deg, #0b1020 0%, #17204a 55%, #221a4d 100%); }
    .badge { display: inline-flex; align-items: center; gap: 8px; padding: 7px 14px; border-radius: 999px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); font-size: 13px; font-weight: 600; margin-bottom: 22px; }
    .badge .live { width: 8px; height: 8px; border-radius: 50%; background: #10b981; box-shadow: 0 0 0 4px rgba(16,185,129,0.25); }
    h1 { font-size: clamp(34px, 6vw, 56px); font-weight: 850; letter-spacing: -0.03em; line-height: 1.08; max-width: 16ch; margin: 0 auto 16px;
      background: linear-gradient(180deg,#fff,#cdd3ff); -webkit-background-clip: text; background-clip: text; color: transparent; }
    p { color: #c7cce0; font-size: clamp(16px,2.4vw,20px); max-width: 56ch; margin: 0 auto; }
    .foot { margin-top: 40px; color: #8b92b3; font-size: 14px; }
    code { background: rgba(255,255,255,0.1); padding: 2px 8px; border-radius: 6px; color: #cdd3ff; }
  </style>
</head>
<body>
  <main>
    <span class="badge"><span class="live"></span>Live</span>
    <h1>AutoBusiness</h1>
    <p>Autonomous agents research a market, build a storefront, wire up Stripe checkout, and ship it — with zero humans in the loop. Each generated business lives at <code>/p/&lt;project-id&gt;/</code>.</p>
    <div class="foot">Built for the Terac Zero Human Company Hackathon.</div>
  </main>
</body>
</html>

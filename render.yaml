# Render Blueprint — AutoBusiness
# Docs: https://render.com/docs/blueprint-spec
#
# What ships today: static-site mockups so judges can see the UI vision.
# What ships later: the three real services (UI, orchestrator, integrations)
# once their packages/ are coded. Add them as sibling entries in `services:`.

services:
  # ---- MOCKUPS (available now) --------------------------------------------
  - type: web
    runtime: static
    name: autobusiness-mockups
    plan: free
    branch: main
    rootDir: mockups
    buildCommand: ""              # pure HTML, nothing to build
    staticPublishPath: .          # serve mockups/ as-is
    autoDeploy: true              # push to main → redeploy
    pullRequestPreviewsEnabled: true
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
    routes:
      - type: rewrite
        source: /
        destination: /index.html

